<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#05080d"><title>NOX POS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:9;background:#080d15;border-bottom:1px solid #24364f;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:serif;font-size:28px;letter-spacing:8px}.sub{font-size:11px;color:#91a8c6}.tabs{display:flex;gap:7px}.tabs button,.btn{border:1px solid #2a4263;background:#101927;color:#eaf2ff;border-radius:12px;padding:11px 15px;font-size:15px}.tabs button.on,.primary{background:#1487ff;border-color:#1487ff;color:white;font-weight:700}.page{display:none;padding:14px}.page.on{display:block}.layout{display:grid;grid-template-columns:210px 1fr 330px;gap:12px}.card{background:#0b1320;border:1px solid #263b58;border-radius:16px;padding:14px}.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seat{padding:15px 4px;border-radius:12px;border:1px solid #315177;background:#101c2d;color:white;font-size:16px}.seat.on{background:#1487ff}.seat.busy:after{content:"●";font-size:9px;margin-left:5px;color:#62e6a5}.cats{display:flex;gap:7px;overflow:auto;padding-bottom:9px}.cat{white-space:nowrap;border:1px solid #2a4263;background:#101927;color:#dbe9fb;border-radius:999px;padding:8px 12px}.cat.on{background:#234a78}.products{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:8px}.prod{min-height:74px;text-align:left;background:#111d2d;color:white;border:1px solid #294667;border-radius:12px;padding:10px}.price{display:block;color:#57b4ff;font-weight:700;margin-top:5px}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid #22334a;padding:10px 0}.qty button{width:31px;height:31px;border-radius:8px;border:1px solid #385a82;background:#14243a;color:white}.money{font-size:27px;color:#31a4ff;font-weight:800}.total{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.small{font-size:12px;color:#9db1cc}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #314968;background:#07101b;color:white;font-size:16px}.actions{display:grid;gap:8px}.wide{width:100%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b1320;border:1px solid #263b58;border-radius:14px;padding:15px}.stat b{font-size:24px;display:block;margin-top:6px}.history{margin-top:12px}.hist{padding:12px;border-bottom:1px solid #263b58}.menu-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.menuitem{background:#0b1320;border:1px solid #263b58;border-radius:10px;padding:10px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{width:min(480px,100%);background:#0c1522;border:1px solid #315177;border-radius:18px;padding:18px}.dialog h2{margin-top:0}.row{display:flex;gap:8px}.row>*{flex:1}
@media(max-width:900px){.layout{grid-template-columns:150px 1fr}.checkout{grid-column:1/-1}.products{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){header{align-items:flex-start;gap:8px;flex-direction:column}.tabs{width:100%;overflow:auto}.tabs button{flex:1;padding:9px}.layout{display:block}.card{margin-bottom:10px}.seats{grid-template-columns:repeat(5,1fr)}.seat{padding:11px 2px}.products{grid-template-columns:repeat(2,1fr)}.menu-list{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="brand">NOX</div><div class="sub">KUMAGAYA · BAR / KARAOKE / MUSIC</div></div><div class="tabs"><button class="on" data-page="order">注文</button><button data-page="sales">売上</button><button data-page="history">履歴</button><button data-page="menu">メニュー</button></div></header>
<main>
<section id="order" class="page on"><div class="layout">
<div class="card"><b>席</b><div class="seats" id="seats"></div><hr style="border-color:#273b56"><label class="small">人数</label><input id="people" class="field" type="number" min="1" value="1"></div>
<div class="card"><div class="cats" id="cats"></div><div class="products" id="products"></div></div>
<div class="card checkout"><b id="cartTitle">現在の注文</b><div id="cart"></div><div id="taxLine" class="small" style="text-align:right;margin-top:12px"></div><div class="total"><span>合計</span><span class="money" id="total">¥0</span></div><div class="actions"><button class="btn primary wide" id="checkoutBtn">会計に進む</button><button class="btn wide" id="spotBtn">＋ スポット商品</button></div></div>
</div></section>
<section id="sales" class="page"><h2>本日の売上</h2><div class="stats"><div class="stat">売上<b id="salesTotal">¥0</b></div><div class="stat">会計数<b id="salesCount">0</b></div><div class="stat">客数<b id="guestCount">0</b></div><div class="stat">客単価<b id="avg">¥0</b></div></div><div class="card" style="margin-top:12px"><h3>支払方法別</h3><div id="payStats"></div></div></section>
<section id="history" class="page"><h2>会計履歴</h2><div class="card history" id="historyList"></div></section>
<section id="menu" class="page"><h2>メニュー</h2><p class="small">表示価格は税別 / 会計時に消費税10%</p><div class="menu-list" id="menuList"></div></section>
</main>
<div id="checkoutModal" class="modal"><div class="dialog"><h2>会計</h2><div id="checkoutDetail"></div><label>支払方法</label><select id="pay" class="field"><option>現金</option><option>クレジットカード</option><option>PayPay</option><option>その他</option></select><div id="cashArea"><label>お預かり</label><input id="received" class="field" type="number" inputmode="numeric"><p>お釣り <b id="change">¥0</b></p></div><div class="row"><button class="btn" id="cancelCheckout">戻る</button><button class="btn primary" id="finishCheckout">会計確定</button></div></div></div>
<script>
const TAX=.10, seatsN=['C1','C2','C3','C4','C5','C6','B1','B2','B3','B4'];
const menu=[
['基本料金','お通し',500],['基本料金','カラオケ歌い放題（1グループ）',1000],['基本料金','ハウスボトル飲み放題90分（男性）',3000],['基本料金','ハウスボトル飲み放題90分（女性）',1500],
['ボトル','鏡月 20度',3000],['ボトル','鏡月 25度',3500],['ボトル','金宮 20度',3000],['ボトル','金宮 25度',3500],['ボトル','二階堂 吉四六',6000],['ボトル','二階堂 豊後路',6500],['ボトル','しろ',4500],['ボトル','黒霧島',5500],['ボトル','赤霧島',4000],['ボトル','角',5000],['ボトル','ジャックダニエル',6000],['ボトル','山崎',25000],['ボトル','山崎 12年',45000],['ボトル','白州',25000],['ボトル','白州 12年',45000],['ボトル','マッカラン 12年',30000],
...['ジントニック','ジンソーダ','モスコミュール','ウォッカトニック','スクリュードライバー','ブルドッグ','ラムコーク','ラムジンジャー','カシスオレンジ','カシスウーロン','カシスソーダ','ファジーネーブル','レゲエパンチ','ピーチソーダ','マリブコーク','マリブオレンジ','カルーアミルク','ピーチミルク','カシスグレープフルーツ','ジンレモン'].map(n=>['カクテル',n,900]),
...['レモンサワー','グレープフルーツサワー','男梅サワー','酎ハイ','緑茶ハイ','ウーロンハイ','モロコシハイ','紅茶ハイ','ジャスミンハイ'].map(n=>['サワー',n,600]),['サワー','メガサイズ 各種',1000],
['ビール','赤星サッポロラガー',900],['ビール','アサヒスーパードライ',900],['ビール','麒麟ラガー',900],['ビール','ハイネケン',800],['ビール','コロナ',800],['ビール','ノンアルコールビール',600],
['ハイボール','角ハイボール',700],['ハイボール','角ハイコーラ',800],['ハイボール','角ハイジンジャー',800],
...['緑茶','烏龍茶','ジャスミン茶','コーン茶','紅茶','コーラ','ジンジャーエール','オレンジジュース','グレープフルーツ','りんごジュース'].map(n=>['ソフトドリンク',n,500]),
...['水','緑茶','ジャスミン茶','コーン茶','紅茶（無糖）','紅茶（加糖）','烏龍茶','炭酸'].map(n=>['割りもの',n,500]),['割りもの','氷 ICE',300],['割りもの','梅 / カットレモン',300],
['ショット','テキーラローズ 1ショット',700],['ショット','テキーラローズ 12杯',7000],['ショット','HABUSH 1杯',1000],['ショット','HABUSH 12杯',10000],
['フード','ポッキー',300],['フード','菓子盛り',500],['フード','ミックスナッツ黒胡椒',500],['フード','枝豆',500],['フード','ポテトフライ',500],['フード','唐揚げ',600],['フード','エビピラフ',600],['フード','チャーハン',700],['フード','ライスバーガー',500],['フード','焼きそば',700],['フード','パスタ各種',1100],['フード','シーザーサラダ',800],['フード','クリームチーズ各種',800],['フード','いぶりがっこ',700],['フード','いちご',700],['フード','ブルーベリー',700],['フード','チョコプレート',1000],['フード','ブルーベリーと苺のチーズ',100],['フード','しじみ味噌汁',500],['フード','ハーゲンダッツアイス',600]
].map((x,i)=>({id:'m'+i,cat:x[0],name:x[1],price:x[2]}));
let orders=load('nox_orders',{}), hist=load('nox_history',[]), spot=load('nox_spot',[]), seat='C1', cat='基本料金';
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}} function save(){localStorage.setItem('nox_orders',JSON.stringify(orders));localStorage.setItem('nox_history',JSON.stringify(hist));localStorage.setItem('nox_spot',JSON.stringify(spot))}
const yen=n=>'¥'+Math.max(0,Math.floor(n)).toLocaleString('ja-JP'); const order=()=>orders[seat]||(orders[seat]={people:1,items:[]}); const subtotal=()=>order().items.reduce((s,x)=>s+x.price*x.qty,0); const tax=()=>Math.floor(subtotal()*TAX); const grand=()=>subtotal()+tax();
function renderSeats(){seats.innerHTML=seatsN.map(s=>'<button class="seat '+(s===seat?'on ':'')+((orders[s]?.items?.length)?'busy':'')+'" data-seat="'+s+'">'+s+'</button>').join('');document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{seat=b.dataset.seat;people.value=order().people||1;render()})}
function renderCats(){let cs=[...new Set([...menu,...spot].map(x=>x.cat))];cats.innerHTML=cs.map(c=>'<button class="cat '+(c===cat?'on':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderCats();renderProducts()})}
function renderProducts(){products.innerHTML=[...menu,...spot].filter(x=>x.cat===cat).map(x=>'<button class="prod" data-id="'+x.id+'">'+x.name+'<span class="price">'+yen(x.price)+' 税別</span></button>').join('');document.querySelectorAll('.prod').forEach(b=>b.onclick=()=>add(b.dataset.id))}
function add(id){let m=[...menu,...spot].find(x=>x.id===id),o=order(),i=o.items.find(x=>x.id===id);i?i.qty++:o.items.push({...m,qty:1});save();render()}
function q(id,d){let o=order(),i=o.items.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)o.items=o.items.filter(x=>x.id!==id);save();render()}
function renderCart(){cartTitle.textContent='現在の注文（'+seat+'）';cart.innerHTML=order().items.length?order().items.map(x=>'<div class="cartrow"><div>'+x.name+'<div class="small">'+yen(x.price)+' 税別</div></div><div class="qty"><button onclick="q(\''+x.id+'\',-1)">−</button> '+x.qty+' <button onclick="q(\''+x.id+'\',1)">＋</button></div><b>'+yen(x.price*x.qty)+'</b></div>').join(''):'<p class="small">注文はまだありません</p>';taxLine.textContent='小計 '+yen(subtotal())+' ＋ TAX10% '+yen(tax());total.textContent=yen(grand())}
function render(){renderSeats();renderCats();renderProducts();renderCart();renderSales();renderHistory()}
people.onchange=()=>{order().people=Math.max(1,+people.value||1);save()};spotBtn.onclick=()=>{let name=prompt('商品名');if(!name)return;let p=+prompt('税別価格');if(!p)return;let m={id:'s'+Date.now(),cat:'スポット',name,price:p};spot.push(m);save();cat='スポット';add(m.id)};
checkoutBtn.onclick=()=>{if(!order().items.length)return alert('注文がありません');checkoutDetail.innerHTML='<p>席 <b>'+seat+'</b> / '+(order().people||1)+'名</p><p>小計 '+yen(subtotal())+'<br>TAX10% '+yen(tax())+'</p><div class="total"><b>合計</b><b class="money">'+yen(grand())+'</b></div>';received.value='';change.textContent=yen(0);checkoutModal.classList.add('on')};
pay.onchange=()=>cashArea.style.display=pay.value==='現金'?'block':'none';received.oninput=()=>change.textContent=yen((+received.value||0)-grand());cancelCheckout.onclick=()=>checkoutModal.classList.remove('on');
finishCheckout.onclick=()=>{let o=order(),amount=grand();if(pay.value==='現金'&&(+received.value||0)<amount)return alert('お預かり金額を確認してください');hist.unshift({id:Date.now(),time:new Date().toISOString(),seat,people:o.people||1,subtotal:subtotal(),tax:tax(),amount,pay:pay.value,items:o.items});delete orders[seat];save();checkoutModal.classList.remove('on');people.value=1;render()};
function today(h){let d=new Date(h.time),n=new Date();return d.toDateString()===n.toDateString()}function renderSales(){let h=hist.filter(today),s=h.reduce((a,x)=>a+x.amount,0),g=h.reduce((a,x)=>a+x.people,0);salesTotal.textContent=yen(s);salesCount.textContent=h.length;guestCount.textContent=g;avg.textContent=yen(g?s/g:0);let p={};h.forEach(x=>p[x.pay]=(p[x.pay]||0)+x.amount);payStats.innerHTML=Object.entries(p).map(([k,v])=>'<p>'+k+'：<b>'+yen(v)+'</b></p>').join('')||'<p class="small">まだ会計がありません</p>'}
function renderHistory(){historyList.innerHTML=hist.map(h=>'<div class="hist"><b>'+h.seat+' '+yen(h.amount)+'</b> <span class="small">'+new Date(h.time).toLocaleString('ja-JP')+' / '+h.pay+' / '+h.people+'名</span></div>').join('')||'<p class="small">履歴はありません</p>';menuList.innerHTML=[...menu,...spot].map(x=>'<div class="menuitem">'+x.cat+'｜'+x.name+' <b>'+yen(x.price)+'</b> <span class="small">税別</span></div>').join('')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===b.dataset.page));render()});render();
</script></body></html>
